name: Build DosXT core

# Builds out/dosxt.bin with build.sh (firmware SDK vendored in sdk/, see SDK_VERSION) and
# keeps it as an artifact; for a tag (a new release) dosxt.bin is also attached to the release.

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nasm
          python3 -m pip install pillow
          wget -q -O toolchain.tar.xz \
            https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.2.rel1/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
          tar -xf toolchain.tar.xz -C "$RUNNER_TEMP"
          echo "GCC_PATH=$RUNNER_TEMP/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dosxt-${{ github.sha }}
          path: |
            out/dosxt.bin
            work/arm/dos_core.elf
            work/arm/dos_core.map
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/dosxt.bin
