name: Build DosXT core

# Builds out/dosxt.bin with build.sh against the firmware's external_cores branch
# (the core bridge, linker scripts and pack_core.py come from there) and keeps it as an artifact.

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  FW_REPO: sylverb/game-and-watch-retro-go-sd
  FW_BRANCH: external_cores

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Checkout firmware (${{ env.FW_BRANCH }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FW_REPO }}
          ref: ${{ env.FW_BRANCH }}
          path: fw

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nasm
          python3 -m pip install pillow
          wget -q -O toolchain.tar.xz \
            https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.2.rel1/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
          tar -xf toolchain.tar.xz -C "$RUNNER_TEMP"
          echo "GCC_PATH=$RUNNER_TEMP/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_ENV"

      - name: Prepare firmware tree (FatFs + ST drivers)
        run: |
          git -C fw submodule update --init --depth 1 Core/Src/porting/lib/FatFs
          make -C fw download_sdk CHECK_DIRTY_SUBMODULE=0 GCC_PATH="$GCC_PATH"

      - name: Build
        run: REPO="$GITHUB_WORKSPACE/fw" ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dosxt-${{ github.sha }}
          path: |
            out/dosxt.bin
            work/arm/dos_core.elf
            work/arm/dos_core.map
          if-no-files-found: error
