; Loom (disco duro de datos: fat12.py newhd loom.img --size 4 LOOM)
; El juego queda en C:. Detecta la EGA y la usa (16 colores).
boot   = !BOOT.img      ; en /cores/dos o en /roms/dos
run    = c:;cd \loom;loom
cpu    = 8 
; Ratón: la cruceta mueve el puntero (más rápido cuanto más tiempo la mantienes)
mouse  = on
up     = mup
down   = mdown
left   = mleft
right  = mright
a      = click          ; botón izquierdo: seleccionar / tocar notas
b      = click2         ; botón derecho
game   = esc            ; saltar escena
start  = f5             ; menú de guardar / cargar
select = space          ; pausa
