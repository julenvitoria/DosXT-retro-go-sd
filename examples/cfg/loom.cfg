; Loom (disco duro de datos: fat12.py newhd loom.img --size 4 LOOM)
; El juego queda en D:. Detecta la EGA y la usa (16 colores).
boot   = !BOOT.img      ; disco duro con el DOS (arranca en C:), en /cores/dosxt o en /roms/dos
run    = d:;cd \loom;loom
cpu    = 8 
; Ratón: la cruceta mueve el puntero (más rápido cuanto más tiempo la mantienes)
mouse  = on
up     = mup
down   = mdown
left   = mleft
right  = mright
b      = click          ; botón izquierdo: seleccionar / tocar notas
a      = click2         ; botón derecho
time   = esc            ; saltar escena
start  = f5             ; menú de guardar / cargar
select = space          ; pausa
