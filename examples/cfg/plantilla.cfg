; Plantilla: cópiala como /cores/dosxt/<nombre de la imagen>.cfg
; (juego.img -> juego.cfg). ";" o "#" empiezan un comentario.
boot   = !BOOT.img      ; disco duro con el DOS (arranca en C:), en /cores/dosxt o en /roms/dos
                            ; (si es un DISQUETE de arranque: el juego va a B:, o a C: si es disco duro)
run    = a:;juego           ; órdenes en el prompt, ";" pegado = Intro (d: si el juego es disco duro)
cpu    = 8                  ; MHz: 4.77, 8, 10, 12, 16, 20
zoom80 = 1                  ; texto de 80 columnas: 1 = ventana de 40, 0 = línea entera
video  = vga                ; vga (EGA y VGA, por defecto) o cga (solo CGA: 640 KB para el DOS)
vram   = 128                ; memoria EGA/VGA en KB: 64, 128 o 256 (sale de la misma reserva
                            ;   que la RAM del DOS: 64 o 128 -> 640 KB, 256 -> 512 KB)
mouse  = off                ; on = ratón: cruceta = puntero, A/B = botones izquierdo/derecho
; Cruceta
up     = up
down   = down
left   = left
right  = right
; Botones
a      = enter
b      = space
game   = esc
time   = keyboard           ; teclado en pantalla
start  = tab
select = backspace
; Teclas: letras, números, enter, space, esc, tab, backspace, shift, ctrl, alt,
; up down left right, home end pgup pgdn ins del, f1..f12, kp0..kp9, - = [ ] ' ` \ , . /
; Punto y coma: escribe semicolon (un ; suelto empieza un comentario).
; Combinaciones con + (ctrl+c, alt+x). "none" = el botón no hace nada.
; Lista completa (y cómo saber qué teclas usa un juego): docs/teclas.md.
; Ratón: mup mdown mleft mright (mover), click y click2 (botones izquierdo y derecho).
