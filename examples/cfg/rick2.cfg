; Rick Dangerous II (disquete de datos: fat12.py new rick2.img RICK2/*)
boot   = !BOOT.img      ; en /cores/dos o en /roms/dos
run    = b:;rick2
cpu    = 4.77           ; velocidad de un PC XT: a mas MHz el juego va demasiado rapido
; Teclas del juego: O arriba, K abajo, Z izquierda, X derecha, Espacio disparar
; (si en su pantalla "KEY DEFINITION" cambias las teclas, cambialas tambien aqui)
up     = o
down   = k
left   = z
right  = x
b      = space          ; disparar / empezar desde el menu
a      = esc            ; terminar la definicion de teclas / salir
game   = esc
start  = 1              ; en el menu inicial: 1 = cambiar a EGA/VGA
zoom80 = 0             ; su menu inicial es de 80 columnas: verlo entero, no la ventana de 40
vram   = 256            ; en EGA/VGA la pantalla de teclas usa mas de 128 KB (si no: "Falta memoria de video"); quedan 512 KB de DOS, le sobran
