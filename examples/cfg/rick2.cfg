; Rick Dangerous II (disquete de datos: fat12.py new rick2.img RICK2/*)
; En su pantalla "KEY DEFINITION" pulsa la cruceta y A para definir las teclas.
boot   = !BOOT.img      ; en /cores/dos o en /roms/dos
run    = b:;rick2
cpu    = 8
; Cruceta (cambia las flechas por otras teclas si el juego no usa flechas, p. ej. q a o p)
up     = up
down   = down
left   = left
right  = right
a      = space          ; disparar / empezar desde el menu
game   = esc
