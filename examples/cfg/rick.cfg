; Rick Dangerous (disquete de datos: fat12.py new rick.img RICK/*)
boot   = !BOOT.img      ; en /cores/dos o en /roms/dos
run    = b:;loadfix rick
cpu    = 8
; Cruceta (cambia las flechas por otras teclas si el juego no usa flechas, p. ej. q a o p)
up     = up
down   = down
left   = left
right  = right
a      = space          ; disparar / poner dinamita (con abajo)
start  = 1              ; en el menu inicial: 1 = EGA (2 = CGA)
game   = esc
