; Rick Dangerous (disquete de datos: fat12.py new rick.img RICK/*)
boot   = !BOOT.img      ; en /cores/dos o en /roms/dos
run    = b:;loadfix rick
cpu    = 4.77           ; velocidad de un PC XT: a mas MHz el juego va demasiado rapido
; Teclas del juego: O arriba, K abajo, Z izquierda, X derecha, Espacio disparar
up     = o
down   = k
left   = z
right  = x
b      = space          ; disparar / poner dinamita (con abajo)
a      = esc            ; salir / menu
start  = 1              ; en el menu inicial: 1 = EGA (2 = CGA)
game   = esc
