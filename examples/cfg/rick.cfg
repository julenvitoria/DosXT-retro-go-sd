; Rick Dangerous (disquete de datos en A:, hecho con: fat12.py new rick.img RICK/*)
boot   = !BOOT.img      ; disco duro con el DOS (arranca en C:), en /cores/dos o en /roms/dos
run    = a:;loadfix rick
cpu    = 4.77           ; velocidad de un PC XT: a mas MHz el juego va demasiado rapido
; Teclas del juego: O arriba, K abajo, Z izquierda, X derecha, Espacio disparar
up     = o
down   = k
left   = z
right  = x
b      = space          ; disparar / poner dinamita (con abajo)
a      = esc            ; salir / menu
start  = 1              ; en el menu inicial: 1 = EGA (2 = CGA)
game   = esc
zoom80 = 0             ; su menu inicial es de 80 columnas: verlo entero, no la ventana de 40
