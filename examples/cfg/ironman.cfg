; Ironman Super Off Road (disquete ironman.img, juego en B:)
; Arranca el DOS desde tu disquete de arranque y lanza el juego en modo VGA
; (otras opciones: game /ega16, game /cga, game /tandy)
boot   = !BOOT.img      ; en /cores/dos o en /roms/dos
; (en "run" el ";" separa ordenes: no pongas comentarios en esa linea)
run    = b:;game /vga
cpu    = 8
; Teclas del jugador 1: Q / A / X / C
up     = q
down   = a
left   = x
right  = c
b      = a              ; la A: "Player 1 Press Button" (empezar), disparo / nitro
a      = n              ; "Are you using a joystick (Y/N)?" -> N
start  = 3              ; "Please select sound" -> 3 (AdLib; 2 = altavoz del PC)
select = 3
game   = esc            ; Esc: salta el test de memoria de la BIOS al arrancar
