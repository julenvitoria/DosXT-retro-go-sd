; Ironman Super Off Road (disquete ironman.img, juego en B:)
; Arranca el DOS desde tu disquete de arranque y lanza el juego en modo VGA
; (otras opciones: game /ega16, game /cga, game /tandy)
boot   = !BOOT.img      ; en /cores/dos o en /roms/dos
run    = b:;game /vga     ; usa 128 KB de memoria de video (el valor por defecto)
cpu    = 8
; Cruceta (cambia las flechas por otras teclas si el juego no usa flechas, p. ej. q a o p)
up     = up
down   = down
left   = left
right  = right
; Al empezar el juego pregunta dos cosas:
start  = n              ; "Are you using a joystick (Y/N)?" -> N
select = 2              ; "Please select sound" -> 2 (IBM sound, altavoz del PC)
; Cruceta = flechas (conducir)
a      = space          ; "PRESS SPACE" / acelerar
b      = enter
game   = esc
