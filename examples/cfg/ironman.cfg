; Ironman Super Off Road (disquete ironman.img: queda en A:)
; Arranca el DOS desde tu disco duro y lanza el juego en modo VGA
; (otras opciones: game /ega16, game /cga, game /tandy)
boot   = !BOOT.img      ; disco duro con el DOS (arranca en C:), en /cores/dosxt o en /roms/dos
run    = a:;game /vga
cpu    = 8
; Teclas del jugador 1: Q / A / X / C
up     = q
down   = a
left   = x
right  = c
b      = a              ; la A: "Player 1 Press Button" (empezar), disparo / nitro
a      = n              ; "Are you using a joystick (Y/N)?" -> N
start  = 3              ; "Please select sound" -> 3 (AdLib; 2 = altavoz del PC)
select = 3
game   = esc            ; Esc: salta el test de memoria de la BIOS al arrancar
