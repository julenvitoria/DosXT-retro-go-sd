; Prince of Persia (disquete de datos en A:, hecho con: fat12.py new prince.img PoP1/*)
; Arranca el DOS desde tu disco duro; el disquete del juego queda en A:
; Detecta la VGA y la usa (256 colores). Para verlo en CGA: run = a:;prince cga
boot   = !BOOT.img      ; disco duro con el DOS (arranca en C:), en /cores/dos o en /roms/dos
run    = a:;prince
cpu    = 10
; Cruceta (cambia las flechas por otras teclas si el juego no usa flechas, p. ej. q a o p)
up     = up
down   = down
left   = left
right  = right
; Controles: cruceta = mover/saltar/agacharse
a      = shift          ; agarrarse / paso con cuidado
b      = up             ; saltar
game   = esc            ; pausa
start  = space          ; ver el tiempo que queda
select = ctrl+a         ; reiniciar el nivel
