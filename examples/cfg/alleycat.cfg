; Alley Cat (disquete con CAT.EXE)
; Arranca el DOS desde tu disco duro; el disquete del juego queda en A:
boot   = !BOOT.img      ; disco duro con el DOS (arranca en C:), en /cores/dosxt o en /roms/dos
run    = a:;cat
cpu    = 8
; Cruceta (cambia las flechas por otras teclas si el juego no usa flechas, p. ej. q a o p)
up     = up
down   = down
left   = left
right  = right
; Cruceta = mover al gato (arriba = saltar)
a      = alt            ; acciones especiales
b      = space          ; "Press any key" / empezar
game   = esc            ; pausa
start  = n              ; "Do you want to use a joystick (Y/N)?" -> N
select = k              ; nivel Kitten (cambia a h, t o a para otros niveles)
; TIME abre el teclado en pantalla (Ctrl+S sonido, Ctrl+R reiniciar, Ctrl+M menu)
