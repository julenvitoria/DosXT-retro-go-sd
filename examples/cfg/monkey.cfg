; The Secret of Monkey Island (VGA, 256 colores)
; Disco duro de datos: python3 tools/fat12.py newhd monkey.img --size 8 MONKEY
; (la carpeta MONKEY con MONKEY.EXE, *.LFL y DISK0x.LEC). El juego queda en C:.
boot   = !BOOT.img      ; en /cores/dos o en /roms/dos
run    = c:;cd \monkey;monkey
cpu    = 8              ; 8 suena bien; más rápido solo si la carga se queda por debajo de ~70 %
; Ratón: la cruceta mueve el puntero (más rápido cuanto más tiempo la mantienes)
mouse  = on
up     = mup
down   = mdown
left   = mleft
right  = mright
a      = click          ; botón izquierdo: andar / usar el verbo
b      = click2         ; botón derecho: acción por defecto
game   = esc            ; saltar escena
start  = f5             ; menú de guardar / cargar
select = space          ; pausa
