; The Secret of Monkey Island (VGA, 256 colores)
; Disco duro de datos: python3 tools/fat12.py newhd monkey.img --size 8 MONKEY
; (la carpeta MONKEY con MONKEY.EXE, *.LFL y DISK0x.LEC). El juego queda en D:.
boot   = !BOOT.img      ; disco duro con el DOS (arranca en C:), en /cores/dosxt o en /roms/dos
run    = d:;cd \monkey;monkey
cpu    = 16             ; máximo: el core baja solo a lo que la consola aguanta sin chasquidos
; Ratón: la cruceta mueve el puntero (más rápido cuanto más tiempo la mantienes)
mouse  = on
up     = mup
down   = mdown
left   = mleft
right  = mright
b      = click          ; botón izquierdo: andar / usar el verbo
a      = click2         ; botón derecho: acción por defecto
game   = esc            ; saltar escena
start  = f5             ; menú de guardar / cargar
select = space          ; pausa
